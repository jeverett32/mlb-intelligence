<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #faf9f7; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn-primary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--accent); border: 1px solid var(--accent); color: #17120a; font-weight: 600; font-size: 14px; text-decoration: none; }
  .btn-secondary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); font-weight: 600; font-size: 14px; }
  .btn-submit { padding: 13px 22px; background: linear-gradient(135deg, #1a2d4a, #243d62); color: #fff; border: 0; border-radius: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(184,134,11,0.4); background: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <a class="btn-primary" href="#">View Public Analytics</a>
  <a class="btn-secondary" href="#">Request Access</a>
  <button class="btn-submit">Sign in</button>
  <span class="chip">Public proof</span>
</body>
</html>
