<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #faf9f7; display: grid; gap: 16px; max-width: 360px; }
  .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
  .field input { width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 14px; font-size: 14px; background: var(--bg-elevated); font-family: inherit; }
  .field.focused input { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.12); outline: none; }
</style>
</head>
<body>
  <div class="field">
    <label>Email address</label>
    <input value="john@example.com" />
  </div>
  <div class="field focused">
    <label>Password</label>
    <input type="password" value="••••••••" />
  </div>
</body>
</html>
