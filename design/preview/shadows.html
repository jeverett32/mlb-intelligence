<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #faf9f7; display: flex; gap: 18px; }
  .card { width: 130px; height: 130px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; display: grid; place-items: end center; padding: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .sm { box-shadow: 0 1px 3px rgba(26,24,20,0.04); }
  .md { box-shadow: 0 4px 12px rgba(26,24,20,0.06); }
  .lg { box-shadow: 0 28px 80px rgba(26,24,20,0.12); }
</style>
</head>
<body>
  <div class="card sm">shadow-sm</div>
  <div class="card md">shadow-md (hover)</div>
  <div class="card lg">shadow-lg (glass)</div>
</body>
</html>
