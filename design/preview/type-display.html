<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #faf9f7; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 120px; flex-shrink: 0; }
  .sample { font-family: var(--font-display); color: var(--text-primary); }
</style>
</head>
<body>
  <span class="eyebrow" style="margin-bottom: 14px; display: block;">Display — Playfair</span>
  <div class="row"><div class="meta">h1 / 64-83px</div><div class="sample" style="font-size: 64px; letter-spacing: -0.08em; line-height: 1;">Public model results</div></div>
  <div class="row"><div class="meta">h2 / 32-48px</div><div class="sample" style="font-size: 40px; letter-spacing: -0.05em;">A public record.</div></div>
  <div class="row"><div class="meta">h3 / 22px DM Sans</div><div class="sample" style="font-family: var(--font-sans); font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Model methodology</div></div>
</body>
</html>
