<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent), #faf9f7; }
  .wrap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; align-items: center; }
  .logo { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; aspect-ratio: 1; display: grid; place-items: center; padding: 8px; }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="../assets/team-logos/NYY.png" alt="NYY"></div>
    <div class="logo"><img src="../assets/team-logos/LAD.png" alt="LAD"></div>
    <div class="logo"><img src="../assets/team-logos/BOS.png" alt="BOS"></div>
    <div class="logo"><img src="../assets/team-logos/HOU.png" alt="HOU"></div>
    <div class="logo"><img src="../assets/team-logos/SDP.png" alt="SDP"></div>
    <div class="logo"><img src="../assets/team-logos/CHC.png" alt="CHC"></div>
    <div class="logo"><img src="../assets/team-logos/PHI.png" alt="PHI"></div>
    <div class="logo"><img src="../assets/team-logos/ATL.png" alt="ATL"></div>
  </div>
</body>
</html>
