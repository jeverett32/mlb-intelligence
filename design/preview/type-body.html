<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #faf9f7; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 130px; flex-shrink: 0; }
</style>
</head>
<body>
  <span class="eyebrow" style="margin-bottom: 14px; display: block;">Body — DM Sans</span>
  <div class="row"><div class="meta">eyebrow / 12px·700</div><span class="eyebrow">Track record</span></div>
  <div class="row"><div class="meta">lead / 17px·400</div><span style="font-size: 17px; line-height: 1.65; color: var(--text-secondary);">A public audit trail for a model-driven baseball workflow.</span></div>
  <div class="row"><div class="meta">body / 14px·400</div><span style="color: var(--text-secondary);">Probability estimates checked against historical calibration, not just raw accuracy.</span></div>
  <div class="row"><div class="meta">label / 12px·700·CAPS</div><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary);">Win Rate</span></div>
  <div class="row"><div class="meta">tnum / 28px·600</div><span style="font-size: 28px; font-weight: 600; letter-spacing: -0.05em; font-feature-settings: 'tnum';">52.4%</span></div>
</body>
</html>
