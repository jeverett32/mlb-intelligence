<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent), #faf9f7; display: flex; gap: 14px; }
  .glass { padding: 18px 20px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.26)); border: 1px solid rgba(255,255,255,0.34); backdrop-filter: blur(14px); box-shadow: 0 4px 12px rgba(26,24,20,0.06), inset 0 1px 0 rgba(255,255,255,0.46); flex: 1; }
  .glance-label { display: block; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .glass strong { display: block; font-size: 16px; margin-bottom: 6px; }
  .glass p { font-size: 12px; line-height: 1.55; margin: 0; }
</style>
</head>
<body>
  <div class="glass">
    <span class="glance-label">What you see first</span>
    <strong>The public track record.</strong>
    <p>Visitors land on the story, then move into live metrics.</p>
  </div>
  <div class="glass">
    <span class="glance-label">What stays private</span>
    <strong>The operator dashboard.</strong>
    <p>Execution controls behind approval.</p>
  </div>
</body>
</html>
