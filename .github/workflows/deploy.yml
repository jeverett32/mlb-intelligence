name: Deploy to Homelab

# Only trigger on pushes to main branch (not PRs)
on:
  push:
    branches: [main]

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Use self-hosted runner with homelab label
    runs-on: [self-hosted, homelab]

    # Timeout to prevent hung deployments
    timeout-minutes: 15

    steps:
      # Checkout is not needed since we're running on the homelab
      # and the deploy script handles git operations

      - name: Pre-deployment health check
        run: |
          echo "=== Pre-deployment health check ==="
          if curl -f -s --connect-timeout 5 --max-time 10 http://localhost:8080/health; then
            echo "✓ Dashboard is healthy before deployment"
          else
            echo "WARNING: Dashboard health check failed before deployment; continuing so deploy can repair it"
          fi

      - name: Run deployment script
        run: |
          echo "=== Starting deployment ==="
          cd /opt/mlb/pipeline

          echo "Deploy user: $(whoami)" 
          id || true
          ls -ld .git .git/objects .git/objects/pack 2>/dev/null || true

          # Repair permission/ownership drift on .git so deploy can fast-forward
          # instead of falling through to archive sync (which leaves HEAD stuck).
          chmod -R u+rwX .git || true
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R mlb:mlb /opt/mlb/pipeline/.git 2>/dev/null || true
            sudo chmod -R u+rwX /opt/mlb/pipeline/.git 2>/dev/null || true
          fi

          echo "Git dir write tests:" 
          for p in .git .git/objects .git/objects/pack .git/refs .git/logs; do
            if [ -d "$p" ]; then
              echo "- $p" 
              touch "$p/.writetest" && rm -f "$p/.writetest"
            fi
          done

          tmp_script="$(mktemp "${RUNNER_TEMP}/deploy.XXXXXX.sh")"

          # Fetch the deployment script directly from GitHub so permission
          # drift in the on-box repo does not block the repair path.
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/deploy.sh" \
            -o "$tmp_script"
          chmod +x "$tmp_script"

          # Invoke through bash so noexec temp mounts do not matter.
          bash "$tmp_script" deploy

          # Cleanup
          rm -f "$tmp_script"

        # Set a longer timeout for the deployment step
        timeout-minutes: 10

      - name: Post-deployment verification
        run: |
          echo "=== Post-deployment verification ==="

          wait_for_url() {
            local url="$1"
            local label="$2"
            local retries=12
            local attempt=1
            while [[ $attempt -le $retries ]]; do
              if curl -f -s --connect-timeout 5 --max-time 10 "$url" >/dev/null; then
                echo "✓ ${label}"
                return 0
              fi
              echo "Waiting for ${label} (attempt ${attempt}/${retries})..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "ERROR: ${label} failed after deployment"
            return 1
          }

          wait_for_url "http://localhost:8080/health" "Health check passed"
          wait_for_url "http://localhost:8080/" "Dashboard root page loads"

          # Check service status
          echo "=== Service Status ==="
          sudo /usr/bin/systemctl is-active mlb-dashboard || {
            echo "ERROR: mlb-dashboard service is not active"
            exit 1
          }
          echo "✓ mlb-dashboard service is active"

          sudo /usr/bin/systemctl is-active mlb-pipeline || {
            echo "WARNING: mlb-pipeline service is not active (this may be expected if pipeline files didn't change)"
            # Don't fail the deployment for this, as it might be intentional
          }

          echo "=== Deployment completed successfully ==="

      # If deployment fails, try to get some diagnostic info
      - name: Collect failure diagnostics
        if: failure()
        run: |
          echo "=== Deployment failed - collecting diagnostics ==="
          echo "Services status:"
          sudo /usr/bin/systemctl status mlb-dashboard --no-pager -l || true
          sudo /usr/bin/systemctl status mlb-pipeline --no-pager -l || true

          echo "Recent logs:"
          sudo /usr/bin/journalctl -u mlb-dashboard --no-pager -l --since="5 minutes ago" || true
          sudo /usr/bin/journalctl -u mlb-pipeline --no-pager -l --since="5 minutes ago" || true

          echo "Disk space:"
          df -h /opt || true

          echo "Repo permissions:"
          ls -ld /opt/mlb/pipeline /opt/mlb/pipeline/.git /opt/mlb/pipeline/.git/objects /opt/mlb/pipeline/.git/objects/pack 2>/dev/null || true

          echo "=== End diagnostics ==="
