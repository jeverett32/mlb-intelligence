<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Betting Dashboard — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border: 1px solid #dde1e7;
      border-radius: 6px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card-header {
      background: #1a2d4a;
      padding: 24px 28px;
      text-align: center;
    }
    .card-header h1 {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-header p {
      color: #8fa8c8;
      font-size: 0.75rem;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .card-body {
      padding: 28px;
    }

    .error-banner {
      background: #fff1f0;
      border: 1px solid #ffa39e;
      border-radius: 4px;
      color: #cf1322;
      font-size: 0.82rem;
      padding: 9px 12px;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #1a202c;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: #1a2d4a;
      box-shadow: 0 0 0 3px rgba(26,45,74,0.08);
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #1a2d4a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #243d62; }
    .btn-submit:active { background: #132238; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>MLB Betting Dashboard</h1>
      <p>Sign in to continue</p>
    </div>
    <div class="card-body">
      {{ERROR_BANNER}}
      <form method="post" action="/login">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
